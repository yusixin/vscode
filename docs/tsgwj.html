<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书馆读者调查问卷</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }
        .container {
            width: 800px;
            margin: 0 auto;
            border: 1px solid #ddd;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #333;
            border-bottom: 2px solid #ccc;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .intro {
            text-indent: 2em;
            margin-bottom: 30px;
            color: #555;
        }
        .question {
            margin-bottom: 20px;
        }
        .q-title {
            font-weight: bold;
            margin-bottom: 8px;
        }
        .options label {
            display: inline-block;
            margin-right: 20px;
            cursor: pointer;
        }
        /* 文本框样式 */
        textarea {
            width: 100%;
            height: 80px;
            border: 1px solid #ccc;
            padding: 5px;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        input[type="text"] {
            width: 200px;
            padding: 4px;
            border: 1px solid #ccc;
        }
        /* 按钮样式 */
        .btn-group {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .btn-group button {
            padding: 8px 30px;
            margin: 0 15px;
            font-size: 16px;
            border: 1px solid #999;
            background-color: #f0f0f0;
            cursor: pointer;
            border-radius: 3px;
        }
        .btn-group button:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>图书馆读者调查问卷</h1>
        
        <div class="intro">
            为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！
        </div>

        <form action="#" method="post">
            <!-- 1. 年级 -->
            <div class="question">
                <div class="q-title">1. 您的年级</div>
                <select name="grade">
                    <option value="">请你选择</option>
                    <option value="freshman">大一</option>
                    <option value="sophomore">大二</option>
                    <option value="junior">大三</option>
                    <option value="senior">大四</option>
                    <option value="graduate">研究生及以上</option>
                </select>
            </div>

            <!-- 2. 专业 -->
            <div class="question">
                <div class="q-title">2. 您的专业</div>
                <input type="text" name="major" placeholder="请输入您的专业">
            </div>

            <!-- 3. 阅览环境 -->
            <div class="question">
                <div class="q-title">3. 对于图书馆的阅览环境</div>
                <div class="options">
                    <label><input type="radio" name="environment" value="satisfied"> 满意</label>
                    <label><input type="radio" name="environment" value="basic_satisfied"> 基本满意</label>
                    <label><input type="radio" name="environment" value="unsatisfied"> 不满意</label>
                </div>
                <div style="margin-top: 10px;">
                    您的建议：<textarea name="env_suggestion"></textarea>
                </div>
            </div>

            <div class="question">
                <div class="q-title">4. 您到图书馆的原因是（可多选）：</div>
                <div class="options">
                    <label><input type="checkbox" name="reason" value="borrow_pro"> 借阅专业图书</label>
                    <label><input type="checkbox" name="reason" value="read_casual"> 随便坐坐，翻翻书刊</label>
                    <label><input type="checkbox" name="reason" value="borrow_cd"> 借阅光盘</label>
                    <label><input type="checkbox" name="reason" value="activity"> 参加图书馆组织的活动</label>
                    <label><input type="checkbox" name="reason" value="study"> 自习，复习功课</label>
                    <label><input type="checkbox" name="reason" value="internet"> 上网</label>
                    <label><input type="checkbox" name="reason" value="search_doc"> 检索电子文献</label>
                </div>
            </div>

            <div class="question">
                <div class="q-title">5. 您到图书馆的频率</div>
                <div class="options">
                    <label><input type="radio" name="frequency" value="daily"> 几乎每天</label>
                    <label><input type="radio" name="frequency" value="weekly"> 每周1- 2次</label>
                    <label><input type="radio" name="frequency" value="monthly"> 每月1- 2次</label>
                    <label><input type="radio" name="frequency" value="rarely"> 几乎不去</label>
                </div>
            </div>

            <div class="question">
                <div class="q-title">6. 您对学校的建议</div>
                <div>请您提出宝贵建议：</div>
                <textarea name="school_suggestion" style="height: 100px;"></textarea>
            </div>

            <!-- 按钮 -->
            <div class="btn-group">
                <button type="submit">提交答案</button>
                <button type="reset">清 空</button>
            </div>
        </form>
    </div>

</body>
</html>
